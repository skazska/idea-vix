openapi: 3.1.1
info:
  title: Idea-Vix API
  description: |
    API for the Idea-Vix application, providing endpoints for managing boards, packages, and user sessions.
    Built with Rust/Axum backend and SolidJS frontend.
  version: 1.0.0
  contact:
    name: Idea-Vix API Support
  license:
    name: MIT
servers:
  - url: http://localhost:7878
    description: Backend development server
security:
  - SessionToken: []
  - {} # Allow unauthenticated access for public endpoints
paths:
  /api/board:
    get:
      tags:
        - Boards
      summary: Retrieve all boards
      description: |
        Get a list of all available boards. Public boards are accessible to all users (read-only), 
        while private boards require authentication.
      security:
        - SessionToken: []
        - {} # Allow unauthenticated access for public boards
      responses:
        '200':
          description: A list of boards (public boards for unauthenticated users, all boards for authenticated users)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Board'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Boards
      summary: Add a new board
      description: Create a new board (requires authentication)
      security:
        - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardNew'
      responses:
        '201':
          description: The created board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/board/{id}:
    get:
      tags:
        - Boards
      summary: Retrieve a specific board
      description: |
        Get details of a specific board by its ID. Public boards are accessible to all users (read-only), 
        while private boards require authentication.
      security:
        - SessionToken: []
        - {} # Allow unauthenticated access for public boards
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the board
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: A board object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Boards
      summary: Update an existing board
      description: Update details of an existing board (requires authentication; owner or manage role required)
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the board
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardPartial'
      responses:
        '200':
          description: The updated board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Boards
      summary: Remove a board
      description: Delete a board by its ID (requires authentication; owner or manage role required)
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the board
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Deleted board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/board/{id}/access:
    post:
      tags:
        - Boards
      summary: Grant access to a board
      description: Owner grants a role (view, edit, manage) to an address
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Board id
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardAccessGrant'
      responses:
        '200':
          description: Granted mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardAccessMapping'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Boards
      summary: List access mappings for a board
      description: Owner lists all access role mappings for a board
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Board id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Access mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardAccessMapping'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/board/{id}/access/{address}:
    delete:
      tags:
        - Boards
      summary: Revoke access to a board
      description: Owner revokes access for an address
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Board id
          schema:
            type: integer
            format: int64
        - name: address
          in: path
          required: true
          description: Address to revoke
          schema:
            type: string
      responses:
        '200':
          description: Remaining access mappings after revoke
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardAccessMapping'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/board/{id}/my/access:
    get:
      tags:
       - Boards
      summary: Get access for a board
      description: Returns access to board for a specific address
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Board id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Access mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRoleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /api/package:
    get:
      tags:
        - Packages
      summary: Retrieve all packages
      description: |
        Get a list of all available packages. Public packages are accessible to all users (read-only), 
        while private packages require authentication.
      security:
        - SessionToken: []
        - {} # Allow unauthenticated access for public packages
      responses:
        '200':
          description: A list of packages (public packages for unauthenticated users, all packages for authenticated users)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Package'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Packages
      summary: Add a new package
      description: Create a new package (requires authentication)
      security:
        - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageNew'
      responses:
        '201':
          description: The created package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/package/{id}:
    get:
      tags:
        - Packages
      summary: Retrieve a specific package
      description: |
        Get details of a specific package by its ID. Public packages are accessible to all users (read-only),
        while private packages require authentication or an invitation (access role).
      security:
        - SessionToken: []
        - {} # Allow unauthenticated access for public packages
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the package
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: A package object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Packages
      summary: Update an existing package
      description: Update details of an existing package (requires authentication; owner or manage role required)
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the package
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackagePartial'
      responses:
        '200':
          description: The updated package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Packages
      summary: Remove a package
      description: Delete a package by its ID (requires authentication; owner or manage role required)
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the package
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Deleted package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/package/{id}/access:
    post:
      tags:
        - Packages
      summary: Grant access to a package
      description: Owner grants a role (view, edit, manage) to an address
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Package id
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageAccessGrant'
      responses:
        '200':
          description: Granted mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageAccessMapping'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Packages
      summary: List access mappings for a package
      description: Owner lists all access role mappings for a package
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Package id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Access mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PackageAccessMapping'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/package/{id}/access/{address}:
    delete:
      tags:
        - Packages
      summary: Revoke access to a package
      description: Owner revokes access for an address
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Package id
          schema:
            type: integer
            format: int64
        - name: address
          in: path
          required: true
          description: Address to revoke
          schema:
            type: string
      responses:
        '200':
          description: Remaining access mappings after revoke
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PackageAccessMapping'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/package/{id}/my/access:
    get:
      tags:
        - Packages
      summary: Get access for a package
      description: Returns access to package for a specific address
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Package id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Access mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRoleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/session/signin:
    post:
      tags:
        - Session
      summary: Sign in
      description: |
        Initiate the sign-in process by providing an email address. 
        A verification code will be sent to the provided email.
      security: []  # No authentication required for signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Sign-in request processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/session/verify:
    post:
      tags:
        - Session
      summary: Verify code
      description: |
        Verify the code sent to the email address during sign-in. 
        Sets an HttpOnly cookie with the JWT and returns session data.
      security: []  # No authentication required for verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
      responses:
        '200':
          description: Code verified successfully, session data returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: Verification code is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/session/me:
    get:
      tags:
        - Session
      summary: Get current session
      description: Returns session data if a valid JWT cookie/header is present, otherwise null
      security:
        - SessionToken: []
        - {}
      responses:
        '200':
          description: Current session or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionData'
                  - type: 'null'
  /api/session/signout:
    post:
      tags:
        - Session
      summary: Sign out
      description: Clears the HttpOnly JWT cookie
      security:
        - SessionToken: []
        - {}
      responses:
        '200':
          description: Sign-out request processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
components:
  securitySchemes:
    SessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authenticated requests, obtained through session verification (also accepted via HttpOnly cookie)
  responses:
    BadRequest:
      description: Bad request - invalid input data
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: Unauthorized - authentication required or invalid/expired JWT token
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: Forbidden - insufficient permissions (owner or manage role required)
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Resource not found
      content:
        text/plain:
          schema:
            type: string
    UnprocessableEntity:
      description: Unprocessable entity - validation failed
      content:
        text/plain:
          schema:
            type: string
    InternalServerError:
      description: Internal server error
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: Conflict - typically slug uniqueness violation
      content:
        text/plain:
          schema:
            type: string
  schemas:
    Board:
      type: object
      required:
        - id
        - name
        - slug
        - is_public
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the board
          example: 1
        name:
          type: string
          description: Name of the board
          minLength: 3
          maxLength: 100
          example: "Project Ideas"
        slug:
          type: string
          description: URL-friendly identifier for the board (auto-generated from name if not provided); referenced by diagram linking flows (see `r&d/analysys/stories/diagrams.md#drawing`)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$|^[a-z]$'
          example: "project-ideas"
        description:
          type:
            - string
            - 'null'
          description: Optional description of the board
          maxLength: 500
          example: "A board for collecting project ideas"
        icon:
          type:
            - string
            - 'null'
          description: Optional icon identifier for the board
          maxLength: 255
          example: "lightbulb"
        is_public:
          type: boolean
          description: Whether the board is publicly accessible
          example: false
    BoardNew:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the board
          minLength: 3
          maxLength: 100
          example: "Project Ideas"
        slug:
          type: string
          description: Optional URL-friendly identifier for the board (auto-generated from name if not provided); referenced by diagram linking flows (see `r&d/analysys/stories/diagrams.md#drawing`)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$|^[a-z]$'
          minLength: 3
          maxLength: 100
          example: "project-ideas"
        description:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Optional description of the board
          example: "A board for collecting project ideas"
        icon:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Optional icon identifier for the board
          example: "lightbulb"
        is_public:
          type: boolean
          description: Whether the board is publicly accessible (defaults to false)
          example: false
    BoardPartial:
      type: object
      properties:
        name:
          type: string
          description: Name of the board
          minLength: 3
          maxLength: 100
          example: "Updated Project Ideas"
        description:
          oneOf:
            - type: string
              maxLength: 500
            - type: 'null'
          description: Optional description of the board; send null to clear the saved description
          example: "Updated board description"
        icon:
          oneOf:
            - type: string
              maxLength: 255
            - type: 'null'
          description: Optional icon identifier for the board; send null to clear the saved icon
          example: "lightbulb-outline"
        is_public:
          type: boolean
          description: Whether the board is publicly accessible
          example: true
    Package:
      type: object
      required:
        - id
        - name
        - slug
        - is_public
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the package
          example: 1
        name:
          type: string
          description: Name of the package
          minLength: 3
          maxLength: 100
          example: "React Components"
        slug:
          type: string
          description: URL-friendly identifier for the package (auto-generated from name if not provided); referenced by diagram linking flows (see `r&d/analysys/stories/diagrams.md#drawing`)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$|^[a-z]$'
          example: "react-components"
        description:
          type:
            - string
            - 'null'
          description: Optional description of the package
          maxLength: 500
          example: "A collection of reusable React components"
        icon:
          type:
            - string
            - 'null'
          description: Optional icon identifier for the package
          maxLength: 255
          example: "package"
        is_public:
          type: boolean
          description: Whether the package is publicly accessible
          example: false
    PackageNew:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the package
          minLength: 3
          maxLength: 100
          example: "React Components"
        slug:
          type: string
          description: Optional URL-friendly identifier for the package (auto-generated from name if not provided); referenced by diagram linking flows (see `r&d/analysys/stories/diagrams.md#drawing`)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$|^[a-z]$'
          minLength: 3
          maxLength: 100
          example: "react-components"
        description:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Optional description of the package
          example: "A collection of reusable React components"
        icon:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Optional icon identifier for the package
          example: "package"
        is_public:
          type: boolean
          description: Whether the package is publicly accessible (defaults to false)
          example: false
    PackagePartial:
      type: object
      properties:
        name:
          type: string
          description: Name of the package
          minLength: 3
          maxLength: 100
          example: "Updated React Components"
        description:
          oneOf:
            - type: string
              maxLength: 500
            - type: 'null'
          description: Optional description of the package; send null to clear the saved description
          example: "An updated collection of reusable React components"
        icon:
          oneOf:
            - type: string
              maxLength: 255
            - type: 'null'
          description: Optional icon identifier for the package; send null to clear the saved icon
          example: "package-updated"
        is_public:
          type: boolean
          description: Whether the package is publicly accessible
          example: true
    SignInRequest:
      type: object
      required:
        - address
      properties:
        address:
          type: string
          description: address for sign-in
          minLength: 1
          example: "user@example.com"
    VerifyCodeRequest:
      type: object
      required:
        - address
        - code
      properties:
        address:
          type: string
          description: address used for sign-in
          minLength: 1
          example: "user@example.com"
        code:
          type: string
          description: Verification code sent to address
          minLength: 1
          example: "123456"
    SessionData:
      type: object
      required:
        - address
        - sent_at
        - expires_at
      properties:
        address:
          type: string
          description: Email address of the authenticated user
          example: "user@example.com"
        sent_at:
          type: integer
          description: Timestamp when the session was created (in seconds since epoch)
          example: 1633072800
        expires_at:
          type: integer
          description: Timestamp when the session expires (in seconds since epoch)
          example: 1633076400
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid verification code"
        details:
          type: string
          description: Additional error details
          example: "The verification code has expired or is incorrect"
    JwtTokenPayload:
      type: object
      description: |
        The structure of the JWT token payload. This is for documentation purposes only
        and not directly used in API requests/responses.
      properties:
        aud:
          type: string
          description: Audience - identifies the intended recipient of the token
          example: "app"
        sub:
          type: string
          description: Subject - typically the user's email address
          example: "user@example.com"
        exp:
          type: integer
          description: Expiration time (in seconds since epoch)
          example: 1659458400
        iat:
          type: integer
          description: Issued at time (in seconds since epoch)
          example: 1659372000

    PackageAccessGrant:
      type: object
      required:
        - address
        - role
      properties:
        address:
          type: string
          description: Address to grant access to
          minLength: 3
          maxLength: 255
          example: user@example.com
        role:
          $ref: '#/components/schemas/AccessRoleGrant'

    PackageAccessMapping:
      type: object
      required:
        - item_id
        - address
        - role
      properties:
        item_id:
          type: integer
          format: int64
          description: Package id
          example: 1
        address:
          type: string
          description: Address with access
          example: user@example.com
        role:
          $ref: '#/components/schemas/AccessRole'

    BoardAccessGrant:
      type: object
      required:
        - address
        - role
      properties:
        address:
          type: string
          description: Address to grant access to
          minLength: 3
          maxLength: 255
          example: user@example.com
        role:
          $ref: '#/components/schemas/AccessRoleGrant'

    BoardAccessMapping:
      type: object
      required:
        - item_id
        - address
        - role
      properties:
        item_id:
          type: integer
          format: int64
          description: Board id
          example: 1
        address:
          type: string
          description: Address with access
          example: user@example.com
        role:
          $ref: '#/components/schemas/AccessRole'

    AccessRole:
      type: string
      description: Role assigned to an address for an item
      enum:
        - owner
        - manage
        - edit
        - view
      example: view

    AccessRoleGrant:
      type: string
      description: Roles that item owners are allowed to grant
      enum:
        - manage
        - edit
        - view
      example: view

    AccessRoleList:
      type: array
      description: Roles granted to the caller for a specific item
      items:
        $ref: '#/components/schemas/AccessRole'

