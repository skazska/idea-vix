openapi: 3.1.1
info:
  title: Idea-Vix API
  description: |
    API for the Idea-Vix application, providing endpoints for managing boards, packages, and user sessions.
    Built with Rust/Axum backend and SolidJS frontend.
  version: 1.0.0
  contact:
    name: Idea-Vix API Support
  license:
    name: MIT
servers:
  - url: http://localhost:5173
    description: Development server
security:
  - SessionToken: []
  - {} # Allow unauthenticated access for public endpoints
paths:
  /api/board:
    get:
      tags:
        - Boards
      summary: Retrieve all boards
      description: |
        Get a list of all available boards. Public boards are accessible to all users (read-only), 
        while private boards require authentication.
      security:
        - SessionToken: []
        - {} # Allow unauthenticated access for public boards
      responses:
        '200':
          description: A list of boards (public boards for unauthenticated users, all boards for authenticated users)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Board'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/board/{id}:
    get:
      tags:
        - Boards
      summary: Retrieve a specific board
      description: |
        Get details of a specific board by its ID. Public boards are accessible to all users (read-only), 
        while private boards require authentication.
      security:
        - SessionToken: []
        - {} # Allow unauthenticated access for public boards
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the board
          schema:
            type: string
            example: "board-123"
      responses:
        '200':
          description: A board object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      
  /api/package:
    get:
      tags:
        - Packages
      summary: Retrieve all packages
      description: |
        Get a list of all available packages. Public packages are accessible to all users (read-only), 
        while private packages require authentication.
      security:
        - SessionToken: []
        - {} # Allow unauthenticated access for public packages
      responses:
        '200':
          description: A list of packages (public packages for unauthenticated users, all packages for authenticated users)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Package'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Packages
      summary: Add a new package
      description: Create a new package (requires authentication)
      security:
        - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageNew'
      responses:
        '201':
          description: The created package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/package/{id}:
    get:
      tags:
        - Packages
      summary: Retrieve a specific package
      description: |
        Get details of a specific package by its ID. Public packages are accessible to all users (read-only), 
        while private packages require authentication.
      security:
        - SessionToken: []
        - {} # Allow unauthenticated access for public packages
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the package
          schema:
            type: string
            example: "pkg-123"
      responses:
        '200':
          description: A package object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Packages
      summary: Update an existing package
      description: Update details of an existing package (requires authentication; owner or manage role required)
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the package
          schema:
            type: string
            example: "pkg-123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackagePartial'
      responses:
        '200':
          description: The updated package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Packages
      summary: Remove a package
      description: Delete a package by its ID (requires authentication; owner or manage role required)
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the package
          schema:
            type: string
            example: "pkg-123"
      responses:
        '204':
          description: Package deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/session/signin:
    post:
      tags:
        - Session
      summary: Sign in
      description: |
        Initiate the sign-in process by providing an email address. 
        A verification code will be sent to the provided email.
      security: []  # No authentication required for signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Sign-in request processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/session/verify:
    post:
      tags:
        - Session
      summary: Verify code
      description: |
        Verify the code sent to the email address during sign-in. 
        Sets an HttpOnly cookie with the JWT and returns session data.
      security: []  # No authentication required for verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
      responses:
        '200':
          description: Code verified successfully, session data returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: Verification code is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/session/me:
    get:
      tags:
        - Session
      summary: Get current session
      description: Returns session data if a valid JWT cookie/header is present, otherwise null
      security:
        - SessionToken: []
        - {}
      responses:
        '200':
          description: Current session or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionData'
                  - type: 'null'
  /api/session/signout:
    post:
      tags:
        - Session
      summary: Sign out
      description: Clears the HttpOnly JWT cookie
      security:
        - SessionToken: []
        - {}
      responses:
        '200':
          description: Sign-out request processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
components:
  securitySchemes:
    SessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authenticated requests, obtained through session verification (also accepted via HttpOnly cookie)
  responses:
    BadRequest:
      description: Bad request - invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - authentication required or invalid/expired JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - insufficient permissions (owner or manage role required)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Unprocessable entity - validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Board:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Unique identifier for the board
          example: "123"
        name:
          type: string
          description: Name of the board
          example: "Project Ideas"
        description:
          type: string
          description: Optional description of the board
          example: "A board for collecting project ideas"
        icon:
          type: string
          description: Optional icon identifier for the board
          example: "lightbulb"
    Package:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Unique identifier for the package
          example: "pkg-123"
        name:
          type: string
          description: Name of the package
          minLength: 1
          example: "React Components"
        description:
          type: string
          description: Optional description of the package
          example: "A collection of reusable React components"
        icon:
          type: string
          description: Optional icon identifier for the package
          example: "package"
        is_public:
          type: boolean
          description: Whether the package is publicly accessible
          example: false
    PackageNew:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the package
          minLength: 1
          example: "React Components"
        description:
          type: string
          description: Optional description of the package
          example: "A collection of reusable React components"
        icon:
          type: string
          description: Optional icon identifier for the package
          example: "package"
        is_public:
          type: boolean
          description: Whether the package is publicly accessible (defaults to false)
          example: false
    PackagePartial:
      type: object
      properties:
        name:
          type: string
          description: Name of the package
          minLength: 1
          example: "Updated React Components"
        description:
          type: string
          description: Optional description of the package
          example: "An updated collection of reusable React components"
        icon:
          type: string
          description: Optional icon identifier for the package
          example: "package-updated"
        is_public:
          type: boolean
          description: Whether the package is publicly accessible
          example: true
    SignInRequest:
      type: object
      required:
        - address
      properties:
        address:
          type: string
          description: address for sign-in
          example: "user@example.com"
    VerifyCodeRequest:
      type: object
      required:
        - address
        - code
      properties:
        address:
          type: string
          description: address used for sign-in
          example: "user@example.com"
        code:
          type: string
          description: Verification code sent to address
          minLength: 1
          example: "123456"
    SessionData:
      type: object
      required:
        - address
        - sent_at
        - expires_at
      properties:
        address:
          type: string
          description: Email address of the authenticated user
          example: "user@example.com"
        sent_at:
          type: integer
          description: Timestamp when the session was created (in seconds since epoch)
          example: 1633072800
        expires_at:
          type: integer
          description: Timestamp when the session expires (in seconds since epoch)
          example: 1633076400
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid verification code"
        details:
          type: string
          description: Additional error details
          example: "The verification code has expired or is incorrect"
    JwtTokenPayload:
      type: object
      description: |
        The structure of the JWT token payload. This is for documentation purposes only
        and not directly used in API requests/responses.
      properties:
        aud:
          type: string
          description: Audience - identifies the intended recipient of the token
          example: "app"
        sub:
          type: string
          description: Subject - typically the user's email address
          example: "user@example.com"
        exp:
          type: integer
          description: Expiration time (in seconds since epoch)
          example: 1659458400
        iat:
          type: integer
          description: Issued at time (in seconds since epoch)
          example: 1659372000

