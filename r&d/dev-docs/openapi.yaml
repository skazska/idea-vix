openapi: 3.1.1
info:
  title: Idea-Vix API
  description: |
    API for the Idea-Vix application, providing endpoints for managing boards, packages, and user sessions.
    Built with Rust/Axum backend and SolidJS frontend.
  version: 1.0.0
  contact:
    name: Idea-Vix API Support
  license:
    name: MIT
servers:
  - url: http://localhost:7878
    description: Backend development server
security:
  - SessionToken: []
  - {} # Allow unauthenticated access for public endpoints
paths:
  /api/board:
    get:
      tags:
        - Boards
      summary: Retrieve all boards
      description: |
        Get a list of all available boards. Public boards are accessible to all users (read-only), 
        while private boards require authentication.
      security:
        - SessionToken: []
        - {} # Allow unauthenticated access for public boards
      responses:
        '200':
          description: A list of boards (public boards for unauthenticated users, all boards for authenticated users)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Board'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Boards
      summary: Add a new board
      description: Create a new board (requires authentication)
      security:
        - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardNew'
      responses:
        '201':
          description: The created board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/board/{id}:
    get:
      tags:
        - Boards
      summary: Retrieve a specific board
      description: |
        Get details of a specific board by its ID. Public boards are accessible to all users (read-only), 
        while private boards require authentication.
      security:
        - SessionToken: []
        - {} # Allow unauthenticated access for public boards
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the board
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: A board object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Boards
      summary: Update an existing board
      description: Update details of an existing board (requires authentication; owner or manage role required)
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the board
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardPartial'
      responses:
        '200':
          description: The updated board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Boards
      summary: Remove a board
      description: Delete a board by its ID (requires authentication; owner or manage role required)
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the board
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Deleted board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/board/{id}/access:
    post:
      tags:
        - Boards
      summary: Grant access to a board
      description: Owner grants a role (view, edit, manage) to an address
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Board id
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardAccessGrant'
      responses:
        '200':
          description: Granted mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardAccessMapping'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Boards
      summary: List access mappings for a board
      description: Owner lists all access role mappings for a board
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Board id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Access mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardAccessMapping'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/board/{id}/access/{address}:
    delete:
      tags:
        - Boards
      summary: Revoke access to a board
      description: Owner revokes access for an address
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Board id
          schema:
            type: integer
            format: int64
        - name: address
          in: path
          required: true
          description: Address to revoke
          schema:
            type: string
      responses:
        '200':
          description: Remaining access mappings after revoke
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardAccessMapping'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/board/{id}/my/access:
    get:
      tags:
       - Boards
      summary: Get access for a board
      description: Returns access to board for a specific address
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Board id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Access mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRoleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'


