  /api/workshop/shapes:
    get:
      tags:
        - Workshop
      summary: List all workshop shapes
      description: Retrieve all available shape blueprints from the global workshop
      security:
        - SessionToken: []
        - {}
      parameters:
        - name: ids
          in: query
          description: Filter by specific shape IDs
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: search
          in: query
          description: Search shapes by name or description
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of workshop shapes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkshopItem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/workshop/shapes/{id}:
