        icon:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Optional icon identifier for the board
          example: "lightbulb"
        is_public:
          type: boolean
          description: Whether the board is publicly accessible (defaults to false)
          example: false
    BoardPartial:
      type: object
      properties:
        name:
          type: string
          description: Name of the board
          minLength: 3
          maxLength: 100
          example: "Updated Project Ideas"
        description:
          oneOf:
            - type: string
